name = "instantblog-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

[vars]
# Comma-separated exact origins allowed to call the API (no trailing slash)
ALLOWED_ORIGINS = "https://instantblog.xyz,http://localhost:5173"
MODEL = "claude-opus-5-5"
# Per-IP hourly limits
LIMIT_DRAFT = "10"
LIMIT_EDIT = "60"
LIMIT_EXTRACT = "40"

[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never commit): npx wrangler secret put ANTHROPIC_API_KEY
