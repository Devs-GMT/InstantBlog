name = "instantblog-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

[vars]
# Comma-separated origins allowed to call the API (no trailing slash). "*" matches one label fragment (Vercel previews).
ALLOWED_ORIGINS = "https://instantblog.vercel.app,https://instantblog-*.vercel.app,http://localhost:5173"
MODEL = "gemini-2.5-flash"          # Google AI Studio free tier (Flash models). Check the live list: GET /v1beta/models
# Per-IP hourly limits
LIMIT_DRAFT = "10"
LIMIT_EDIT = "60"
LIMIT_EXTRACT = "40"

[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never commit): npx wrangler secret put GEMINI_API_KEY   (create one free at https://aistudio.google.com/apikey)
