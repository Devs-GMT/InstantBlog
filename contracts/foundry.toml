[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"          # safe default in case BOT Chain doesn't support PUSH0 (Shanghai)
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
botchain = "https://rpc.botchain.ai"
botchain_testnet = "https://rpc.bohr.life"
