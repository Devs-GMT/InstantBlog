  </style>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
    <div class="stage dots"></div>

    <div class="cap" id="s4-cap">
      <span class="chip chip-blue" id="s4-chip">01 · Brief</span>
      <h2 id="s4-h"><span class="w">Start</span> <span class="w">with</span> <span class="w">a</span> <span class="w">brief.</span></h2>
      <p id="s4-p">A topic, a tone, 3 to 5 key points and up to 5 source links.</p>
    </div>

    <div id="s4-panel">
      <div class="card" id="s4-card">
        <h2>Your brief</h2>
        <div class="field">
          <span class="label">What's it about?</span>
          <div class="input" id="s4-topic"><span id="s4-topic-text" data-text="Why small dApps win hackathons"></span><span class="s4-caret" id="s4-caret"></span></div>
        </div>
        <div class="field">
          <span class="label">Voice tone</span>
          <div class="chips-wrap">
            <span class="chip chip-select" id="s4-friendly">Friendly</span>
            <span class="chip chip-select">Professional</span>
            <span class="chip chip-select">Witty</span>
          </div>
        </div>
        <div class="field">
          <span class="label">Key points (3–5) <span class="helper">Each becomes a section</span></span>
          <div class="points">
            <div class="point s4-point"><span class="handle">⋮⋮</span><span class="num-badge">1</span><div class="input">Scope is a feature</div><span></span></div>
            <div class="point s4-point"><span class="handle">⋮⋮</span><span class="num-badge">2</span><div class="input">Demo beats docs</div><span></span></div>
            <div class="point s4-point"><span class="handle">⋮⋮</span><span class="num-badge">3</span><div class="input">Judges remember stories</div><span></span></div>
          </div>
        </div>
        <div class="field">

          <div id="s4-status">
            <span class="chip chip-panel" id="s4-reading">Reading…</span>
            <span class="chip chip-green" id="s4-read">✓ Read · Hackathon (Wikipedia)</span>

    <div class="cursor" id="s4-cursor"><svg viewBox="0 0 24 24"><path d="M5 2.5 19 11l-6.3 1.6L9.6 19z" fill="#0D111B" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></svg></div>
  </div>
  <script>
    (function () {
      var B = 0.49917;
      var tt = document.getElementById("s4-topic-text");
      Array.from(tt.dataset.text).forEach(function (ch) {
        var s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        tt.appendChild(s);
      });
      var tl = gsap.timeline({ paused: true });

      // caption
      tl.fromTo("#s4-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.1);
      tl.fromTo("#s4-h .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.067 }, 0.2);
      tl.fromTo("#s4-p", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, 0.55);

      // panel lands
      tl.fromTo("#s4-panel", { opacity: 0, x: 90, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
      gsap.set(".s4-point, .s4-src, #s4-reading, #s4-read", { opacity: 0 });

      // topic types in
      Array.from(tt.querySelectorAll(".c")).forEach(function (el, i) {
        tl.set(el, { display: "inline" }, 0.6 + i * 0.03);
      });
      tl.set("#s4-caret", { opacity: 0 }, 1.6);

      // cursor picks Friendly on beat 4
      tl.fromTo("#s4-cursor", { x: 1700, y: 1100 }, { x: 1121, y: 362, duration: 0.6, ease: "power3.inOut" }, 4 * B - 0.62);
      tl.to("#s4-cursor", { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, 4 * B);
      tl.to("#s4-friendly", { backgroundColor: "#0D111B", borderColor: "#0D111B", color: "#FFFFFF", duration: 0.12 }, 4 * B + 0.04);

      // key points, one per half beat
      document.querySelectorAll(".s4-point").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 4.5 * B + i * B / 2);
      });

      // source is read
      tl.fromTo(".s4-src", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 6 * B);
      tl.fromTo("#s4-reading", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6 * B + 0.15);
      tl.to("#s4-reading", { opacity: 0, duration: 0.12 }, 8 * B);
      tl.fromTo("#s4-read", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", transformOrigin: "0% 50%" }, 8 * B);

      // Generate on beat 10
      tl.to("#s4-cursor", { x: 1333, y: 908, duration: 0.6, ease: "power3.inOut" }, 10 * B - 0.66);
      tl.to("#s4-cursor", { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, 10 * B);
      tl.to("#s4-gen", { scale: 0.97, duration: 0.07, yoyo: true, repeat: 1 }, 10 * B);
      tl.to("#s4-gen-busy", { opacity: 1, duration: 0.12 }, 10 * B + 0.1);

      // leave: blur swap
      tl.to("#s4-panel", { opacity: 0, scale: 1.05, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 5.62);
      tl.to("#s4-cap, #s4-cursor", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, 5.6);
      window.__timelines["s4"] = tl;
    })();
  </script>
